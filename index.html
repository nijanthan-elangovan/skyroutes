<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyRoutes — Global Flight Visualization</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynh5YHVZhKjMZlT96aROonYzQME=" crossorigin="">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="scene-wrapper">
        <div id="map"></div>
        <canvas id="flight-canvas"></canvas>
        <div id="labels-overlay"></div>
    </div>

    <!-- 3D effect overlays -->
    <div id="horizon-fade"></div>
    <div id="horizon-glow"></div>
    <div id="reflection"></div>

    <!-- Flight history ribbon -->
    <div id="history-ribbon"></div>

    <!-- Controls -->
    <button id="egg-btn" type="button" title="Track a flight" aria-controls="track-panel" aria-expanded="false">✈</button>
    <button id="view-btn" type="button" title="Toggle 3D view" aria-pressed="false">3D</button>
    <div id="track-panel" role="dialog" aria-modal="false" aria-labelledby="track-panel-title" aria-hidden="true" inert>
        <div class="tp-header">
            <span class="tp-title" id="track-panel-title">TRACK FLIGHT</span>
            <button id="tp-close" type="button" aria-label="Close flight tracker">×</button>
        </div>
        <div class="tp-section">
            <label class="tp-label" for="tp-flight">FLIGHT NUMBER</label>
            <div class="tp-input-row">
                <input type="text" id="tp-flight" class="tp-input" placeholder="e.g. QR 845" spellcheck="false" autocomplete="off">
                <button id="tp-search-flight" class="tp-btn">GO</button>
            </div>
        </div>
        <div class="tp-divider"></div>
        <div class="tp-section">
            <label class="tp-label" for="tp-from">ROUTE</label>
            <div class="tp-input-row">
                <input type="text" id="tp-from" class="tp-input tp-input-half" placeholder="FROM" aria-label="Origin airport code" spellcheck="false" autocomplete="off" maxlength="3">
                <span class="tp-arrow">→</span>
                <input type="text" id="tp-to" class="tp-input tp-input-half" placeholder="TO" aria-label="Destination airport code" spellcheck="false" autocomplete="off" maxlength="3">
                <button id="tp-search-route" class="tp-btn">GO</button>
            </div>
        </div>
        <div id="tp-status" class="tp-status" role="status" aria-live="polite"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="airports.js"></script>
    <script src="flights.js"></script>
    <script src="effects.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
