<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyRoutes — Global Flight Visualization</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="scene-wrapper">
        <div id="map"></div>
        <canvas id="cloud-canvas"></canvas>
        <canvas id="flight-canvas"></canvas>
        <div id="labels-overlay"></div>
    </div>

    <!-- Controls -->
    <div id="egg-btn" title="Track a flight">✈</div>
    <div id="view-btn" title="Toggle 3D view">3D</div>
    <div id="track-panel">
        <div class="tp-header">
            <span class="tp-title">TRACK FLIGHT</span>
            <span id="tp-close">×</span>
        </div>
        <div class="tp-section">
            <label class="tp-label">FLIGHT NUMBER</label>
            <div class="tp-input-row">
                <input type="text" id="tp-flight" class="tp-input" placeholder="e.g. QR 845" spellcheck="false" autocomplete="off">
                <button id="tp-search-flight" class="tp-btn">GO</button>
            </div>
        </div>
        <div class="tp-divider"></div>
        <div class="tp-section">
            <label class="tp-label">ROUTE</label>
            <div class="tp-input-row">
                <input type="text" id="tp-from" class="tp-input tp-input-half" placeholder="FROM" spellcheck="false" autocomplete="off" maxlength="3">
                <span class="tp-arrow">→</span>
                <input type="text" id="tp-to" class="tp-input tp-input-half" placeholder="TO" spellcheck="false" autocomplete="off" maxlength="3">
                <button id="tp-search-route" class="tp-btn">GO</button>
            </div>
        </div>
        <div id="tp-status" class="tp-status"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="airports.js"></script>
    <script src="flights.js"></script>
    <script src="clouds.js"></script>
    <script src="labels.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
